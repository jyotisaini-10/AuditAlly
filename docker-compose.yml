services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/auditally
      REDIS_URI: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      AUDITALLY_LLM_MOCK: ${AUDITALLY_LLM_MOCK:-1}
      SCAN_CACHE_TTL_SECONDS: ${SCAN_CACHE_TTL_SECONDS:-3600}
      SCAN_CACHE_DISABLED: ${SCAN_CACHE_DISABLED:-0}
      EXPLAIN_CACHE_TTL_SECONDS: ${EXPLAIN_CACHE_TTL_SECONDS:-604800}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-3600}
      RATE_LIMIT_MAX_SCANS: ${RATE_LIMIT_MAX_SCANS:-20}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-0}
      GROQ_INPUT_COST_PER_1M: ${GROQ_INPUT_COST_PER_1M:-0.59}
      GROQ_OUTPUT_COST_PER_1M: ${GROQ_OUTPUT_COST_PER_1M:-0.79}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mongo_data:
