<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Teal circle background -->
  <circle cx="32" cy="32" r="32" fill="#1d7a73"/>

  <!-- Magnifying glass lens (outer ring) -->
  <circle cx="27" cy="27" r="17" fill="none" stroke="white" stroke-width="4"/>

  <!-- Magnifying glass handle -->
  <line x1="39" y1="39" x2="52" y2="52" stroke="white" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Accessibility person icon inside the lens -->
  <!-- Head -->
  <circle cx="27" cy="19" r="3" fill="white"/>
  <!-- Body -->
  <line x1="27" y1="22" x2="27" y2="30" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="19" y1="25" x2="35" y2="25" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="27" y1="30" x2="21" y2="38" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="27" y1="30" x2="33" y2="38" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
</svg>
